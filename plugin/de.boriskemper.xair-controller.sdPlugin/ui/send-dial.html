<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="xac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <div class="pi-hint xac-help" data-i18n="pi.send_help"></div>

  <pi-section title="pi.strip" class="pi-needs-connection">
    <pi-select setting="strip" source="channels" label-setting="stripLabel" placeholder="pi.choose_strip" empty="pi.no_strips"></pi-select>
  </pi-section>

  <pi-section title="pi.send_target" class="pi-needs-connection">
    <pi-select setting="target" source="send-targets" label-setting="targetLabel" placeholder="pi.choose_target" empty="pi.no_strips"></pi-select>
  </pi-section>

  <pi-section title="pi.display">
    <pi-choice setting="style" default="digital" columns="4" data-options='[
      {"value":"digital","label":"pi.style_digital","icon":"digital"},
      {"value":"classic","label":"pi.style_classic","icon":"classic"},
      {"value":"ring","label":"pi.style_ring","icon":"ring"},
      {"value":"pie","label":"pi.style_pie","icon":"pie"}
    ]'></pi-choice>
    <div class="pi-hint pi-padded" data-i18n="pi.send_style_hint"></div>
  </pi-section>

  <pi-section class="pi-win" title="pi.header">
    <pi-choice setting="header" default="plain" columns="3" data-options='[
      {"value":"plain","label":"pi.header_plain"},
      {"value":"color","label":"pi.header_color"},
      {"value":"strip","label":"pi.header_strip"}
    ]'></pi-choice>
  </pi-section>

  <pi-section class="pi-win" title="pi.background">
    <pi-select setting="background" source="backgrounds" placeholder="pi.background_auto"></pi-select>
    <div class="pi-hint pi-padded" data-i18n="pi.background_hint"></div>
  </pi-section>

  <pi-section class="pi-win" title="pi.dial_controls">
    <pi-range setting="step" min="0.5" max="6" step="0.5" default="1" unit=" dB" label="pi.dial_step"></pi-range>
  </pi-section>

  <pi-more></pi-more>

  <xac-connection-card></xac-connection-card>

  <div class="pi-footer"><span data-plugin-version>XR-C</span></div>
</body>

</html>
