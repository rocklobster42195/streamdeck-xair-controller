<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fader</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="xac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <div class="pi-hint xac-help" data-i18n="pi.fader_help"></div>

  <pi-section title="pi.strip" class="pi-needs-connection">
    <pi-select setting="strip" source="strips" placeholder="pi.choose_strip" empty="pi.no_strips"></pi-select>
  </pi-section>

  <pi-section title="pi.meter_style">
    <pi-choice setting="style" default="digital" columns="2" data-options='[
      {"value":"digital","label":"pi.style_digital","icon":"digital"},
      {"value":"classic","label":"pi.style_classic","icon":"classic"}
    ]'></pi-choice>
  </pi-section>

  <pi-section title="pi.dial_controls">
    <pi-range setting="step" min="0.5" max="6" step="0.5" default="1" unit=" dB" label="pi.dial_step"></pi-range>
  </pi-section>

  <xac-connection-card></xac-connection-card>

  <div class="pi-footer"><span data-plugin-version>XR-C</span></div>
</body>

</html>
